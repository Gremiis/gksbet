<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GKSBET – Roda de Coins</title>
<style>
  body{font-family:Arial;background:#111;color:#fff;text-align:center;padding-top:40px}
  #wheel{width:300px;height:300px;border-radius:50%;background:conic-gradient(
    #e74c3c 0deg 60deg,
    #f1c40f 60deg 120deg,
    #2ecc71 120deg 180deg,
    #3498db 180deg 240deg,
    #9b59b6 240deg 300deg,
    #e74c3c 300deg 360deg
  );margin:20px auto;transition:transform 3s ease-out}
  button{padding:12px 24px;font-size:18px;cursor:pointer;margin:6px}
  #saldo{font-size:28px;margin:20px}
  #adminPanel{display:none;background:#222;padding:20px;margin:20px auto;width:340px;border-radius:8px}
  small{color:#bbb}
</style>
</head>

<body>
<h1>GKSBET</h1>
<small>Jogo fictício para entretenimento • Coins não possuem valor real</small>

<div id="saldo">Coins: <span id="s">0</span></div>
<button onclick="girar()">🎯 Girar 50 Coins</button>

<div id="wheel"></div>
<p id="result"></p>

<hr style="width:300px;border-color:#333">

<button onclick="toggleAdmin()">🔧 Admin</button>

<div id="adminPanel">
  <h3>Admin – Gremiis</h3>
  <button onclick="addBonus()">➕ Dar 200 Coins</button>
  <button onclick="zerarSaldo()">♻️ Zerar Saldo</button>
  <button onclick="exportarDados()">📦 Exportar Dados</button>
</div>

<script>
/* ===== CONFIGURAÇÕES ===== */
const APOSTA = 50;
const RETORNO = 1.2;          // 20% de bônus quando ganha
const CHANCE_GANHO = 0.45;    // 45% de chance
const ADM_KEY = 'Sintia1404+';
/* ======================== */

let s = localStorage.getItem('coins')
  ? parseInt(localStorage.getItem('coins'))
  : 0;

atualizarSaldo();

function atualizarSaldo(){
  document.getElementById('s').innerText = s;
}

function girar(){
  if(s < APOSTA){
    alert('Coins insuficientes.');
    return;
  }

  s -= APOSTA;
  atualizarSaldo();

  let giro = Math.floor(Math.random() * 360 + 720);
  document.getElementById('wheel').style.transform = `rotate(${giro}deg)`;

  setTimeout(()=>{
    let ganhou = Math.random() < CHANCE_GANHO;

    if(ganhou){
      let ganho = Math.floor(APOSTA * RETORNO);
      s += ganho;
      document.getElementById('result').innerText =
        `🎉 Você ganhou ${ganho} Coins!`;
    } else {
      document.getElementById('result').innerText =
        `❌ Você perdeu ${APOSTA} Coins.`;
    }

    localStorage.setItem('coins', s);
    atualizarSaldo();
  }, 3000);
}

/* ===== FUNÇÕES ADMIN ===== */
function toggleAdmin(){
  let pw = prompt('Senha do Admin:');
  if(pw === ADM_KEY){
    document.getElementById('adminPanel').style.display = 'block';
  } else {
    alert('Senha inválida.');
  }
}

function addBonus(){
  s += 200;
  localStorage.setItem('coins', s);
  atualizarSaldo();
}

function zerarSaldo(){
  s = 0;
  localStorage.setItem('coins', s);
  atualizarSaldo();
}

function exportarDados(){
  let data = {
    admin: 'Gremiis',
    coins: s,
    data: new Date().toISOString()
  };
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gksbet_backup.json';
  a.click();
}
</script>

</body>
</html>
